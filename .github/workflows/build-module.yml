name: Build AWG 3.1 for ImmortalWrt 25.12.2 (ramips/mt7621)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: amneziawg 3.1 · immortalwrt 25.12.2 · ramips/mt7621 · mipsel_24kc
    runs-on: ubuntu-latest
    env:
      DL_BASE: https://downloads.immortalwrt.org
      IW_VERSION: "25.12.2"
      TARGET: ramips
      SUBTARGET: mt7621
      RELEASE_TAG: immortalwrt-25.12.2-mt7621
    steps:
      - name: Checkout AWG source code
        uses: actions/checkout@v4

      - name: Show package versions
        run: |
          grep -h '^PKG_VERSION' kmod-amneziawg/Makefile amneziawg-tools/Makefile luci-proto-amneziawg/Makefile
          grep -h '^PKG_SOURCE_VERSION' kmod-amneziawg/Makefile amneziawg-tools/Makefile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools zstd

      - name: Download ImmortalWrt SDK
        run: |
          set -euo pipefail
          LISTING="$DL_BASE/releases/$IW_VERSION/targets/$TARGET/$SUBTARGET/"
          SDK_FILE="immortalwrt-sdk-${IW_VERSION}-${TARGET}-${SUBTARGET}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          if ! wget -q "$LISTING$SDK_FILE"; then
            SDK_FILE=$(curl -s "$LISTING" \
              | grep -o "immortalwrt-sdk-${IW_VERSION}-${TARGET}-${SUBTARGET}[^\"]*Linux-x86_64\.tar\.zst" \
              | head -n1)
            [ -n "$SDK_FILE" ] || { echo "SDK not found in $LISTING"; exit 1; }
            wget "$LISTING$SDK_FILE"
          fi
          echo "SDK: $SDK_FILE"
          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"
          ls -d immortalwrt-sdk-*/

      - name: Setup SDK feeds and packages
        run: |
          set -euo pipefail
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          [ -n "$SDK_DIR" ] || { echo "SDK dir not found"; exit 1; }
          WORKSPACE_DIR=$PWD
          cd "$SDK_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp -r "$WORKSPACE_DIR/kmod-amneziawg" package/
          cp -r "$WORKSPACE_DIR/amneziawg-tools" package/
          cp -r "$WORKSPACE_DIR/luci-proto-amneziawg" package/

          echo "CONFIG_PACKAGE_kmod-amneziawg=m" > .config
          echo "CONFIG_PACKAGE_amneziawg-tools=y" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y" >> .config

          make defconfig

      - name: Build packages
        run: |
          set -euo pipefail
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          cd "$SDK_DIR"
          make package/luci-proto-amneziawg/compile V=s

      - name: Verify built packages
        run: |
          set -euo pipefail
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          cd "$SDK_DIR"
          for pkg in kmod-amneziawg amneziawg-tools luci-proto-amneziawg luci-i18n-amneziawg-ru; do
            f=$(find bin -name "${pkg}*.apk" | head -n1)
            [ -n "$f" ] || { echo "::error::$pkg not built"; exit 1; }
            echo "OK: $f"
          done

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          SDK_DIR=$(find . -maxdepth 1 -name "immortalwrt-sdk-*" -type d | head -n1)
          mkdir -p out
          for pkg in kmod-amneziawg amneziawg-tools luci-proto-amneziawg luci-i18n-amneziawg-ru; do
            f=$(find "$SDK_DIR/bin" -name "${pkg}*.apk" | head -n1)
            [ -n "$f" ] || { echo "::error::$pkg not found"; exit 1; }
            cp "$f" "out/${pkg}.apk"
          done
          ls -l out/
          cd out && sha256sum *.apk | tee SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-3.1-immortalwrt-25.12.2-mt7621
          path: out/
          if-no-files-found: error

      - name: Attach to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AmneziaWG 3.1 for ImmortalWrt 25.12.2 (ramips/mt7621)
          files: |
            out/*.apk
            out/SHA256SUMS
          make_latest: false
